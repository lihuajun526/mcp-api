###############################################################################
# /etc/nginx/sites-available/mcp-api.conf
# mcp-api 三节点反向代理（部署在 172.22.16.28 / tmq03 上）
#
#   mcp01  172.22.16.14:18080   (43.156.1.37)
#   mcp02  172.22.16.22:18080   (43.156.54.160)
#   mcp03  172.22.16.28:18080   (43.153.215.155)
#
# 默认轮询（round-robin）转发到三台后端。nginx 默认策略即轮询，
# 每台权重相同、无 backup，逐台轮流分发。
# /mcp、/api/v1、/health 路径原样透传（proxy_pass 不带结尾斜杠）。
###############################################################################

upstream mcp_api_backend {
    # 默认轮询；如需权重可写成 server 172.22.16.14:18080 weight=2;
    server 172.22.16.14:18080 max_fails=3 fail_timeout=15s;
    server 172.22.16.22:18080 max_fails=3 fail_timeout=15s;
    server 172.22.16.28:18080 max_fails=3 fail_timeout=15s;

    keepalive 32;
}

server {
    listen      80;
    listen      [::]:80;
    # 内网 IP + 公网 IP 均作为入口；如后续绑定域名，追加到 server_name
    server_name 172.22.16.28 43.153.215.155 localhost;

    access_log /var/log/nginx/mcp-api.access.log main;
    error_log  /var/log/nginx/mcp-api.error.log warn;

    client_max_body_size 2m;

    location / {
        proxy_pass http://mcp_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
