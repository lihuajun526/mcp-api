###############################################################################
# /etc/nginx/sites-available/mcp-api.conf
# mcp-api 反向代理（部署在 172.22.16.28 / tmq03）
#
# 对外域名：mcp.sellerdexmcp.com
#   证书复用 /etc/ssl/cloudflare/sellerdexmcp.pem（SAN: *.sellerdexmcp.com）
#   访问链路：浏览器 -https-> Cloudflare -https(Full Strict)-> 本机 443
#
# 后端【不是轮询】，而是「每 8 小时切换一个节点」：
#   上游 upstream mcp_api_backend 定义在 /etc/nginx/conf.d/mcp-api-upstream.conf，
#   由 /opt/mcp-api/switch-backend.sh 定时改写并 reload。
#   候选节点：172.22.16.14 / 172.22.16.22 / 172.22.16.28（均监听 18080）
#
# 路径原样透传（proxy_pass 不带结尾斜杠）：
#   https://mcp.sellerdexmcp.com/mcp      -> /mcp（JSON-RPC）
#   https://mcp.sellerdexmcp.com/api/v1/… -> /api/v1/…
#   https://mcp.sellerdexmcp.com/health   -> /health
###############################################################################

# ---------------------------------------------------------------- 80 -> 443
server {
    listen      80;
    listen      [::]:80;
    server_name mcp.sellerdexmcp.com;

    # 放行 ACME 校验目录（未来若改用 Let's Encrypt 可直接复用）
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- 443
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name mcp.sellerdexmcp.com;

    ssl_certificate     /etc/ssl/cloudflare/sellerdexmcp.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sellerdexmcp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/mcp-api.access.log main;
    error_log  /var/log/nginx/mcp-api.error.log warn;

    client_max_body_size 2m;

    # 单一后端（由 conf.d/mcp-api-upstream.conf 定义，定时切换）
    location / {
        proxy_pass http://mcp_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
