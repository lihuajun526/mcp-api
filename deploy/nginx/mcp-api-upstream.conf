###############################################################################
# /etc/nginx/conf.d/mcp-api-upstream.conf
#
# mcp-api 后端上游（单节点，非轮询）。
# 本文件由 /opt/mcp-api/switch-backend.sh 每 8 小时改写一次，
# 在 3 个内网节点间循环切换，随后 nginx -t && systemctl reload。
#
#   172.22.16.14   tmq01 / 43.156.1.37
#   172.22.16.22   tmq02 / 43.156.54.160
#   172.22.16.28   tmq03 / 43.153.215.155
#
# 注意：本文件在 http 上下文被 include，upstream 供 sites-enabled/mcp-api.conf 引用。
###############################################################################

upstream mcp_api_backend {
    server 172.22.16.14:18080;
    keepalive 32;
}
