server:
  port: 18080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mcp_api?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE
  redis:
    host: 127.0.0.1
    port: 6379

mcp:
  security:
    api-key-header: X-API-Key
  third-party:
    sellersprite:
      base-url: https://www.sellersprite.com
      competing-lookup-path: /v3/api/competing-lookup
      request-timeout-ms: 10000
  cache:
    enabled: true
    read-enabled: false
    ttl-seconds: 300
